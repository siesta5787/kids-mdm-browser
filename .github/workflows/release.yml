name: Release

# Push a vX.YY tag (matching versionName in app/build.gradle.kts) to build, sign, and publish
# app-release.apk as that tag's GitHub Release - which kid-phone-server's tracked-app poller picks
# up and pushes to enrolled phones.
on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Read Release Keystore
      # Shared Kids MDM release key (also signs kids-launcher-mdm and kids-mdm-im).
      run: |
        echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
        echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
    - name: Build release APK
      run: ./gradlew assembleRelease
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
    - name: Clean up keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/release.p12"
    - name: Publish GitHub Release
      run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --title "$GITHUB_REF_NAME" --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
